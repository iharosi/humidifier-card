<svg xmlns="http://www.w3.org/2000/svg" width="360" height="96" viewBox="0 0 360 96" role="img" aria-label="Compact humidifier card layout: title with status icons and power switch on one line, mode dropdown, fan slider and icon toggles on the next">
  <style>
    .t { font-family: Roboto, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .name { font-size: 15px; font-weight: 500; fill: #212121; }
    .val  { font-size: 14px; fill: #727272; }
  </style>

  <rect x="0.5" y="0.5" width="359" height="95" rx="12" fill="#ffffff" stroke="#e6e6e6"/>

  <!-- title line -->
  <path d="M24 15c6 7 9.5 11 9.5 15.5a9.5 9.5 0 0 1-19 0C14.5 26 18 22 24 15z" fill="#03a9f4"/>
  <text class="t name" x="44" y="31">Office Humidifier</text>

  <!-- status icons -->
  <g stroke="#727272" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M231 24.5a7 7 0 0 1 10 0"/>
    <path d="M233.5 27.5a3.5 3.5 0 0 1 5 0"/>
  </g>
  <circle cx="236" cy="30.5" r="1.2" fill="#727272"/>

  <circle cx="262" cy="26" r="6.5" fill="none" stroke="#43a047" stroke-width="1.5"/>
  <path d="M259 26l2.2 2.2 4-4.4" fill="none" stroke="#43a047" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M283 29c0-4.5 1.2-7 4.5-7s4.5 2.5 4.5 7z" fill="none" stroke="#43a047" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M281 29h13" stroke="#43a047" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M285.8 31a1.8 1.8 0 0 0 3.4 0z" fill="#43a047"/>

  <!-- power switch -->
  <rect x="308" y="19" width="36" height="14" rx="7" fill="#03a9f4" opacity="0.45"/>
  <circle cx="338" cy="26" r="10" fill="#03a9f4"/>

  <!-- control strip -->
  <rect x="12" y="53" width="124" height="30" rx="4" fill="#f5f5f5" stroke="#dcdcdc"/>
  <text class="t val" x="24" y="72">Auto</text>
  <path d="M116 65l5 6 5-6" fill="none" stroke="#727272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="148" y="66" width="84" height="4" rx="2" fill="#e0e0e0"/>
  <rect x="148" y="66" width="42" height="4" rx="2" fill="#03a9f4"/>
  <circle cx="190" cy="68" r="8" fill="#03a9f4"/>
  <text class="t val" x="244" y="73">2</text>

  <!-- indicator light: on -->
  <circle cx="278" cy="68" r="18" fill="#03a9f4"/>
  <path d="M278 59a5.5 5.5 0 0 0-3.2 10v2.2h6.4V69A5.5 5.5 0 0 0 278 59z" fill="#ffffff"/>
  <path d="M275.4 73.6h5.2" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- buzzer: off -->
  <circle cx="320" cy="68" r="18" fill="#e4e4e4"/>
  <path d="M313 65h3l4-3.5v13l-4-3.5h-3z" fill="#8a8a8a"/>
  <path d="M323.5 64.5l5 7M328.5 64.5l-5 7" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round"/>
</svg>
