<svg xmlns="http://www.w3.org/2000/svg" width="360" height="108" viewBox="0 0 360 108" role="img" aria-label="Humidifier card: name with the device fault beneath it and a connection icon, then a control strip with a power button, mode dropdown, fan slider and icon toggles for the indicator light and buzzer">
  <style>
    .t { font-family: Roboto, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .name { font-size: 15px; font-weight: 500; fill: #212121; }
    .sub  { font-size: 13px; fill: #727272; }
    .val  { font-size: 14px; fill: #727272; }
  </style>

  <rect x="0.5" y="0.5" width="359" height="107" rx="12" fill="#ffffff" stroke="#e6e6e6"/>

  <!-- title block -->
  <path d="M25 17c6 7 9.5 11 9.5 15.5a9.5 9.5 0 0 1-19 0C15.5 28 19 24 25 17z" fill="#03a9f4"/>
  <text class="t name" x="46" y="29">Office Humidifier</text>
  <text class="t sub"  x="46" y="47">No fault</text>

  <!-- connection icon -->
  <g stroke="#727272" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M325 29a9 9 0 0 1 13 0"/>
    <path d="M328.5 33a4.5 4.5 0 0 1 6 0"/>
  </g>
  <circle cx="331.5" cy="37" r="1.5" fill="#727272"/>

  <!-- control strip -->
  <circle cx="32" cy="78" r="20" fill="#03a9f4"/>
  <path d="M32 68v10" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M25.5 71.5a9 9 0 1 0 13 0" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>

  <rect x="60" y="63" width="112" height="30" rx="4" fill="#f5f5f5" stroke="#dcdcdc"/>
  <text class="t val" x="70" y="82">Auto</text>
  <path d="M152 75l5 6 5-6" fill="none" stroke="#727272" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="182" y="76" width="62" height="4" rx="2" fill="#e0e0e0"/>
  <rect x="182" y="76" width="31" height="4" rx="2" fill="#03a9f4"/>
  <circle cx="213" cy="78" r="8" fill="#03a9f4"/>
  <text class="t val" x="256" y="83">2</text>

  <!-- indicator light: on -->
  <circle cx="286" cy="78" r="18" fill="#03a9f4"/>
  <path d="M286 69a5.5 5.5 0 0 0-3.2 10v2.2h6.4V79A5.5 5.5 0 0 0 286 69z" fill="#ffffff"/>
  <path d="M283.4 83.6h5.2" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>

  <!-- buzzer: off -->
  <circle cx="328" cy="78" r="18" fill="#e4e4e4"/>
  <path d="M321 75h3l4-3.5v13l-4-3.5h-3z" fill="#8a8a8a"/>
  <path d="M331.5 74.5l5 7M336.5 74.5l-5 7" stroke="#8a8a8a" stroke-width="1.6" stroke-linecap="round"/>
</svg>
